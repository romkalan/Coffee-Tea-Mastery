[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "18"

# Настройки для SPA (React Router)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

## Дополнительные настройки (опционально)
